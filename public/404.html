<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - Page not found</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1d1d1f;
      --muted: #6e6e73;
      --accent: #f38020;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #121212;
        --fg: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #f6a04d;
      }
    }
    :root[data-theme="dark"] {
      --bg: #121212;
      --fg: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #f6a04d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      box-sizing: border-box;
    }
    main { text-align: center; max-width: 420px; }
    .code { font-size: 64px; font-weight: 700; color: var(--accent); margin: 0; line-height: 1; }
    h1 { font-size: 22px; font-weight: 600; margin: 12px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a {
      color: var(--fg);
      text-decoration: none;
      border: 1px solid var(--muted);
      border-radius: 6px;
      padding: 8px 16px;
      display: inline-block;
    }
    a:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has moved.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
